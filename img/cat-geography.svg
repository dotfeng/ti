<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="地理：经纬网、地形等高线与罗盘">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f2f9f4"/>
      <stop offset="0.55" stop-color="#e2f0e6"/>
      <stop offset="1" stop-color="#cfe3d5"/>
    </linearGradient>
    <linearGradient id="gGlobe" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7fc9a6"/>
      <stop offset="0.55" stop-color="#3f9c7a"/>
      <stop offset="1" stop-color="#1f6a56"/>
    </linearGradient>
    <linearGradient id="gLand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e2b0"/>
      <stop offset="0.5" stop-color="#dcc079"/>
      <stop offset="1" stop-color="#b9924a"/>
    </linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d9a8"/>
      <stop offset="1" stop-color="#c9a866"/>
    </linearGradient>
    <pattern id="gGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c2a6" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
    <clipPath id="gGlobeClip">
      <circle cx="430" cy="190" r="146"/>
    </clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#gBg)"/>
  <rect width="640" height="400" fill="url(#gGrid)"/>

  <!-- 左：等高线地形 -->
  <g>
    <path d="M20 330 C 70 300 96 268 132 262 C 174 255 196 286 232 282 C 262 279 276 250 300 254"
          fill="none" stroke="#9c8250" stroke-opacity="0.25" stroke-width="2"/>
    <g fill="none" stroke-linejoin="round">
      <path d="M40 320 C 96 320 118 300 124 268 C 130 238 106 214 78 222 C 52 230 44 262 58 282 C 70 300 100 300 112 286"
            stroke="#a58a58" stroke-opacity="0.55" stroke-width="2.6"/>
      <path d="M64 312 C 100 312 112 296 116 272 C 120 250 104 234 84 240 C 66 246 60 268 70 282 C 78 294 98 294 106 284"
            stroke="#a58a58" stroke-opacity="0.7" stroke-width="2.4"/>
      <path d="M84 302 C 104 302 110 290 112 274 C 114 260 104 250 92 254 C 80 258 76 272 82 282 C 87 290 98 290 102 284"
            stroke="#a58a58" stroke-opacity="0.85" stroke-width="2.2"/>
    </g>
    <path d="M84 302 C 104 302 110 290 112 274 C 114 260 104 250 92 254 C 80 258 76 272 82 282 C 87 290 98 290 102 284 Z"
          fill="url(#gHill)" fill-opacity="0.75" stroke="#8f7443" stroke-opacity="0.5" stroke-width="1.6"/>
    <g stroke="#8f7443" stroke-opacity="0.55" stroke-width="1.6">
      <path d="M40 320 L28 344" stroke-dasharray="0"/>
    </g>
    <text x="26" y="366" font-family="Georgia,serif" font-size="15" font-style="italic" fill="#6b5a33" opacity="0.75">contour</text>
  </g>

  <!-- 右：地球与经纬网 -->
  <g>
    <circle cx="430" cy="190" r="146" fill="url(#gGlobe)"/>
    <g clip-path="url(#gGlobeClip)">
      <!-- 陆地 -->
      <path d="M470 52 C 526 64 556 106 534 150 C 512 192 484 214 456 198 C 430 182 438 138 448 106 C 456 80 458 54 470 52 Z"
            fill="url(#gLand)" fill-opacity="0.92"/>
      <path d="M330 108 C 358 96 384 122 374 158 C 364 198 352 232 330 226 C 308 220 302 176 312 144 C 317 128 320 112 330 108 Z"
            fill="url(#gLand)" fill-opacity="0.85"/>
      <path d="M386 252 C 410 244 432 258 424 274 C 416 292 392 292 382 278 C 374 266 376 254 386 252 Z"
            fill="url(#gLand)" fill-opacity="0.72"/>
      <!-- 经纬网 -->
      <g fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.5">
        <ellipse cx="430" cy="190" rx="146" ry="52"/>
        <ellipse cx="430" cy="190" rx="146" ry="104"/>
        <ellipse cx="430" cy="190" rx="52" ry="146"/>
        <ellipse cx="430" cy="190" rx="104" ry="146"/>
        <line x1="284" y1="190" x2="576" y2="190"/>
        <line x1="430" y1="44" x2="430" y2="336"/>
      </g>
      <ellipse cx="384" cy="112" rx="56" ry="32" fill="#ffffff" fill-opacity="0.13"/>
    </g>
    <circle cx="430" cy="190" r="146" fill="none" stroke="#175f4c" stroke-opacity="0.35" stroke-width="2.6"/>
    <!-- 定位针 -->
    <g>
      <path d="M430 96 C 410 96 396 110 396 128 C 396 152 430 182 430 182 C 430 182 464 152 464 128 C 464 110 450 96 430 96 Z"
            fill="#f6f0df" fill-opacity="0.95" stroke="#2c6f58" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="430" cy="127" r="13" fill="#cf5a3f" fill-opacity="0.9"/>
      <circle cx="430" cy="127" r="5.5" fill="#fdf6e8" fill-opacity="0.95"/>
    </g>
  </g>

  <text x="40" y="382" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#2c6f58" opacity="0.6">longitude · latitude · contour</text>
  <text x="486" y="382" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#1f6a56" opacity="0.4">geography</text>
</svg>
