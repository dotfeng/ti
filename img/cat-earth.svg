<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="地球科学：地球剖面与地层">
  <defs>
    <linearGradient id="eBg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f3faf9"/>
      <stop offset="0.55" stop-color="#e3f1f0"/>
      <stop offset="1" stop-color="#cfe4e4"/>
    </linearGradient>
    <linearGradient id="eSea" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5cb3c9"/>
      <stop offset="0.55" stop-color="#2f88a3"/>
      <stop offset="1" stop-color="#1a5b76"/>
    </linearGradient>
    <linearGradient id="eLand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94cf7c"/>
      <stop offset="1" stop-color="#4f9b52"/>
    </linearGradient>
    <linearGradient id="eCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e2a6"/>
      <stop offset="1" stop-color="#e0a33c"/>
    </linearGradient>
    <pattern id="eGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8cc0c6" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
    <clipPath id="eGlobe">
      <circle cx="442" cy="190" r="148"/>
    </clipPath>
    <clipPath id="eSector">
      <path d="M442 190 L442 338 A148 148 0 0 1 294 190 Z"/>
    </clipPath>
    <clipPath id="eColumn">
      <rect x="78" y="84" width="160" height="248" rx="10"/>
    </clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#eBg)"/>
  <rect width="640" height="400" fill="url(#eGrid)"/>

  <!-- 地层柱 -->
  <g>
    <g clip-path="url(#eColumn)">
      <rect x="78" y="84" width="160" height="64" fill="#dcc9a8"/>
      <rect x="78" y="148" width="160" height="52" fill="#c9ad80"/>
      <rect x="78" y="200" width="160" height="58" fill="#b08b5f"/>
      <rect x="78" y="258" width="160" height="74" fill="#91704c"/>
      <g fill="none" stroke="#6b543c" stroke-opacity="0.32" stroke-width="1.6">
        <path d="M78 150 Q108 143 138 151 T206 149 T240 152"/>
        <path d="M78 202 Q110 196 142 203 T206 201 T240 204"/>
        <path d="M78 260 Q112 253 144 261 T208 259 T240 261"/>
      </g>
      <!-- 化石：扇贝 -->
      <g>
        <path d="M160 250 L133 213 A28 28 0 0 1 187 213 Z" fill="#f4e8d0" fill-opacity="0.95"
              stroke="#7c6244" stroke-opacity="0.55" stroke-width="1.6"/>
        <g stroke="#7c6244" stroke-opacity="0.42" stroke-width="1.3" fill="none">
          <path d="M160 250 L136 201"/>
          <path d="M160 250 L147 190"/>
          <path d="M160 250 L160 186"/>
          <path d="M160 250 L173 190"/>
          <path d="M160 250 L184 201"/>
        </g>
        <path d="M148 226 A20 20 0 0 1 172 226" fill="none" stroke="#7c6244" stroke-opacity="0.3" stroke-width="1.2"/>
      </g>
    </g>
    <rect x="78" y="84" width="160" height="248" rx="10" fill="none" stroke="#5d7d80" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- 地球 -->
  <g>
    <circle cx="442" cy="190" r="148" fill="url(#eSea)"/>
    <g clip-path="url(#eGlobe)">
      <path d="M470 56 C522 70 546 112 522 152 C500 190 478 214 452 196 C428 180 434 138 444 108 C452 82 456 58 470 56 Z" fill="url(#eLand)" fill-opacity="0.9"/>
      <path d="M332 118 C358 108 378 134 370 166 C362 202 352 232 331 226 C310 220 306 178 316 148 C321 132 322 122 332 118 Z" fill="url(#eLand)" fill-opacity="0.82"/>
      <path d="M392 246 C412 240 430 252 424 268 C418 284 396 286 386 274 C378 264 380 250 392 246 Z" fill="url(#eLand)" fill-opacity="0.7"/>
      <ellipse cx="392" cy="112" rx="58" ry="34" fill="#ffffff" fill-opacity="0.14"/>
    </g>

    <!-- 剖面：地壳 / 地幔 / 外核 / 内核 -->
    <g clip-path="url(#eSector)">
      <circle cx="442" cy="190" r="148" fill="#8a6a4a"/>
      <circle cx="442" cy="190" r="141" fill="#c2703d"/>
      <circle cx="442" cy="190" r="94" fill="#df9832"/>
      <circle cx="442" cy="190" r="54" fill="url(#eCore)"/>
      <g fill="none" stroke="#7a4a22" stroke-opacity="0.22" stroke-width="1.4">
        <circle cx="442" cy="190" r="141"/>
        <circle cx="442" cy="190" r="94"/>
        <circle cx="442" cy="190" r="54"/>
      </g>
    </g>
    <path d="M442 190 L442 338 A148 148 0 0 1 294 190 Z" fill="none"
          stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.4"/>
    <circle cx="442" cy="190" r="148" fill="none" stroke="#17556b" stroke-opacity="0.3" stroke-width="2.6"/>
  </g>

  <text x="40" y="382" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#15616e" opacity="0.6">Moho · Gutenberg · Lehmann</text>
  <text x="486" y="382" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#17556b" opacity="0.4">earth</text>
</svg>
